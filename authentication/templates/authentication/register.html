{% extends "authentication/base_auth.html" %}

{% block auth_title %}Sign up | Habisin{% endblock %}

{% block auth_content %}
<h1 class="text-center text-600 md:text-[56px] leading-tight">Create Account</h1>
<p class="mt-3.5 mb-9 text-center text-lg text-[#7C8C80]">Sign up to start saving your meals</p>

<form method="post" novalidate>
  {% csrf_token %}
  <div class="mb-6">
    <label for="name" class="block mb-2.5 text-xl font-bold text-brand-green-dark">Your name</label>
    <input type="text" id="name" name="name" autocomplete="name"
           class="w-full h-14 px-5 rounded-2xl border-2 border-border-color bg-transparent text-brand-green-dark focus-visible:outline-none focus-visible:border-brand-green focus-visible:ring-4 focus-visible:ring-brand-green/30">
  </div>
  <div class="mb-6">
    <label for="email" class="block mb-2.5 text-xl font-bold text-brand-green-dark">Your email</label>
    <input type="email" id="email" name="email" autocomplete="email"
           class="w-full h-14 px-5 rounded-2xl border-2 border-border-color bg-transparent text-brand-green-dark focus-visible:outline-none focus-visible:border-brand-green focus-visible:ring-4 focus-visible:ring-brand-green/30">
  </div>
  <div class="mb-6">
    <label for="password" class="block mb-2.5 text-xl font-bold text-brand-green-dark">Password</label>
    <input type="password" id="password" name="password" autocomplete="new-password"
           class="w-full h-14 px-5 rounded-2xl border-2 border-border-color bg-transparent text-brand-green-dark focus-visible:outline-none focus-visible:border-brand-green focus-visible:ring-4 focus-visible:ring-brand-green/30">
  </div>
  <div class="mb-6">
    <label for="confirm_password" class="block mb-2.5 text-xl font-bold text-brand-green-dark">Confirm password</label>
    <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password"
           class="w-full h-14 px-5 rounded-2xl border-2 border-border-color bg-transparent text-brand-green-dark focus-visible:outline-none focus-visible:border-brand-green focus-visible:ring-4 focus-visible:ring-brand-green/30">
  </div>
  <button type="submit" class="w-full h-14 rounded-2xl bg-brand-green hover:opacity-90 text-white text-xl font-medium cursor-pointer">Sign up</button>
</form>

<p class="mt-7 text-center text-[#7C8C80]">Already have an account? <a href="{% url 'authentication:login' %}" class="text-[#6B4EE6]">Login</a></p>
{% endblock %}
