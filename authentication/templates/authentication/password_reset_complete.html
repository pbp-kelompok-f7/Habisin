{% extends "authentication/base_auth.html" %}

{% block auth_title %}Password updated | Habisin{% endblock %}

{% block auth_content %}
<svg class="mx-auto mt-[clamp(0.5rem,2vh,1.25rem)] text-brand-green" style="display:block;flex-shrink:0;width:clamp(3.5rem,11vh,5rem);height:clamp(3.5rem,11vh,5rem)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg>
<h1 class="mt-1 text-center text-[length:clamp(2.25rem,7vh,3.75rem)] leading-tight" style="flex-shrink:0">Password Updated</h1>
<p class="mt-1 mb-[clamp(1rem,3vh,1.75rem)] text-center text-[length:clamp(1rem,2.4vh,1.25rem)] leading-snug text-[#7C8C80]">Your password has been changed. You can now sign in with your new password.</p>

<a href="{% url 'authentication:login' %}" class="w-full h-[clamp(3rem,8vh,4rem)] rounded-2xl bg-brand-green hover:opacity-90 text-white text-[length:clamp(1.125rem,2.7vh,1.375rem)] font-medium flex items-center justify-center">Login</a>
{% endblock %}
