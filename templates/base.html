{% load static %}
{% load tailwind_tags %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Habisin{% endblock %}</title>
  <link rel="icon" href="/static/svg/favicon.svg" type="image/svg+xml"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  {% tailwind_css %}
  {% block meta %} {% endblock meta %}
</head>
<body>
<header class="">
  <div class="">
    <a href="{% url 'home:show_home' %}" class="">
      <img src="static/svg/logo.svg" alt="Logo of Habisin" />
    </a>
    <nav>
      <a class="header-text" href="">Test</a>
    </nav>
  </div>
</header>
{% block content %} {% endblock content %}
<footer class="">
  <div class="">
    <p>&copy; 2026 Habisin.</p>
  </div>
</footer>
</body>
</html>
