{% load static %}
<header class="site-header nav-shell w-full border-b border-[#E5DEC9] bg-background">
<div class="nav-shell-in site-container flex flex-row py-4 gap-6 items-center justify-between">
  <!-- Brand Logo -->
  <a href="{% url 'home:show_home' %}" class="flex items-center gap-2 flex-shrink-0 font-heading font-extrabold"
     style="font-size:22px;line-height:32px;letter-spacing:-.02em;color:#0f3b2e;">
    <img src="{% static 'home/img/LOGO.svg' %}" alt="" class="h-8 w-auto" />
    Habisin
  </a>

  <!-- Tombol hamburger (hanya tampil di layar kecil) -->
  <button type="button" class="nav-toggle" aria-label="Buka menu" aria-expanded="false" aria-controls="main-nav">
    <svg class="icon-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    <svg class="icon-close" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>

  <!-- Navigation Menu Links -->
  <nav id="main-nav" class="nav-collapse flex flex-row flex-1 items-center justify-between ml-4">
    <div class="flex flex-row items-center gap-1 sm:gap-2">
      <!-- Kulkas -->
      <a
        href="{% url 'fridge:show_fridge' %}"
        class="font-bold text-sm sm:text-base px-3 sm:px-4 py-2 rounded-xl transition {% if request.resolver_match.app_name == 'fridge' %}bg-brand-green-dark text-background{% else %}text-brand-green-dark hover:text-brand-green{% endif %}"
      >
        Kulkas
      </a>

      <!-- Resep -->
      <a
        href="{% url 'discovery:show_discovery' %}"
        class="font-bold text-sm sm:text-base px-3 sm:px-4 py-2 rounded-xl transition {% if request.resolver_match.app_name == 'discovery' %}bg-brand-green-dark text-background{% else %}text-brand-green-dark hover:text-brand-green{% endif %}"
      >
        Resep
      </a>

      <!-- Bookmark -->
      <a
        href="{% url 'bookmarks:show_bookmarks' %}"
        class="font-bold text-sm sm:text-base px-3 sm:px-4 py-2 rounded-xl transition {% if request.resolver_match.app_name == 'bookmarks' %}bg-brand-green-dark text-background{% else %}text-brand-green-dark hover:text-brand-green{% endif %}"
      >
        Bookmark
      </a>

      <!-- Meals Planner -->
      <a
        href="{% url 'meals_planner:show_planner' %}"
        {% if request.resolver_match.app_name == 'meals_planner' %}aria-current="page"{% endif %}
        class="font-bold text-sm sm:text-base px-3 sm:px-4 py-2 rounded-xl transition {% if request.resolver_match.app_name == 'meals_planner' %}bg-brand-green-dark text-background{% else %}text-brand-green-dark hover:text-brand-green{% endif %}"
      >
        Meals Planner
      </a>

      <!-- Saved Meals -->
      <a
        href="{% url 'saved_meals:show_saved_meals' %}"
        class="font-bold text-sm sm:text-base px-4 sm:px-5 py-2 rounded-xl transition {% if request.resolver_match.app_name == 'saved_meals' or request.resolver_match.url_name == 'show_saved_meals' %}bg-brand-green-dark text-background shadow-sm{% else %}text-brand-green-dark hover:text-brand-green{% endif %}"
      >
        Saved Meals
      </a>
    </div>

        <!-- Right Profile Avatar / Auth -->
    <div class="flex flex-row items-center gap-3">
      {% if user.is_authenticated %}
      <a href="{% url 'authentication:profile' %}" class="nav-avatar w-10 h-10 rounded-full border-2 border-brand-green-dark overflow-hidden bg-sky-200 flex items-center justify-center shadow-sm hover:opacity-90 transition" title="Profile" aria-label="Profile">
        <img
          src="https://api.dicebear.com/7.x/avataaars/svg?seed={{ user.username }}&backgroundColor=b6e3f4"
          alt="{{ user.username }}"
          class="w-full h-full object-cover"
        />
      </a>
      {% else %}
      <a href="{% url 'authentication:login' %}" class="nav-avatar w-10 h-10 rounded-full border-2 border-brand-green-dark overflow-hidden bg-sky-200 flex items-center justify-center shadow-sm hover:opacity-90 transition" title="Sign In" aria-label="Sign In">
        <img
          src="https://api.dicebear.com/7.x/avataaars/svg?seed=HabisinUser&backgroundColor=b6e3f4"
          alt="Profile Avatar"
          class="w-full h-full object-cover"
        />
      </a>
      {% endif %}
    </div>
  </nav>
</div>
</header>
