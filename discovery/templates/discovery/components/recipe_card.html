{# Tanpa `recipe`, kartu dirender kosong sebagai <template> untuk discovery.js #}
<a data-field="link" class="block h-full"{% if recipe %} href="{% url 'discovery:show_recipe_detail' recipe.id %}"{% endif %}>
  <article class="flex flex-col items-center gap-2 h-full border-2 border-border-color rounded-xl bg-background-white">
    <img data-field="image" loading="lazy"{% if recipe %} src="{{ recipe.image }}" alt="{{ recipe.name }}"{% endif %}
         class="w-full aspect-video object-cover rounded-t-xl bg-brand-green">
    <div class="flex flex-col px-4 pb-4 gap-2 w-full h-full">
      <div class="flex flex-col items-start w-full">
        <h3 data-field="name" class="text-500">{{ recipe.name }}</h3>
        <p data-field="ingredients" class="line-clamp-2">{{ recipe.ingredients|join:", " }}</p>
      </div>
      <div class="flex items-center justify-between gap-2 pt-2 mt-auto">
        <div class="flex gap-3.5 text-200 text-muted">
          <span class="inline-flex items-center gap-1.5">
            <svg class="h-[15px] w-[15px]" viewBox="0 0 64 64" enable-background="new 0 0 64 64" id="Layer_1" version="1.1" xml:space="preserve" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" fill="#000000"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M19,5c-0.552,0-1,0.448-1,1v5c0,0.552,0.448,1,1,1s1-0.448,1-1V6C20,5.448,19.552,5,19,5z" fill="#231F20"></path> <g> <path d="M45,19.135V15c0-0.552-0.448-1-1-1s-1,0.448-1,1v4.135c0,0.552,0.448,1,1,1S45,19.687,45,19.135" fill="#231F20"></path> </g> <g> <path d="M28,17c0-0.713,0-1.392,0-1.941c-0.006-2.19-1.809-3.939-4-3.941H14c-2.191,0.002-3.994,1.751-4,3.941 c0,0.55,0,1.229,0,1.941H28z" fill="#231F20"></path> <path d="M7.551,19C7.206,19.588,7.001,20.268,7,21v34c0.004,2.207,1.793,3.996,4,4h16c2.207-0.004,3.996-1.793,4-4 V21c-0.001-0.732-0.206-1.412-0.551-2H7.551z M13,54c0,0.553-0.448,1-1,1s-1-0.447-1-1V22c0-0.552,0.448-1,1-1s1,0.448,1,1V54z" fill="#231F20"></path> </g> <g> <path d="M52,24c0-0.571,0-1.094,0-1.509c0-1.016-0.519-1.906-1.251-2.495c-0.736-0.595-1.702-0.937-2.749-0.938h-8 c-1.046,0.001-2.012,0.343-2.749,0.938C36.519,20.585,36,21.475,36,22.491c0,0.415,0,0.938,0,1.509H52z" fill="#231F20"></path> <path d="M34.509,26c-0.32,0.569-0.508,1.223-0.509,1.923V55c0.004,2.207,1.793,3.996,4,4h12 c2.207-0.004,3.996-1.793,4-4V27.923c-0.001-0.701-0.189-1.354-0.509-1.923H34.509z M40,54c0,0.553-0.448,1-1,1s-1-0.447-1-1V29 c0-0.552,0.448-1,1-1s1,0.448,1,1V54z" fill="#231F20"></path> </g> </g></svg>
            <span data-field="count">{% if recipe %}{{ recipe.ingredient_count }} bahan{% endif %}</span>
          </span>
        </div>
        {% if removable %}
        <button type="button"
                aria-label="Hapus {{ recipe.name }} dari kategori"
                aria-haspopup="dialog"
                class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full border-2 border-border-color bg-background-white transition-colors hover:border-brand-red hover:bg-brand-red hover:text-background cursor-pointer"
                data-remove-recipe="{{ recipe.id }}"
                data-recipe-name="{{ recipe.name }}">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        {% else %}
        <button type="button"
                aria-pressed="{% if recipe.bookmarked %}true{% else %}false{% endif %}"
                aria-label="Simpan Resep ke bookmark"
                class="group flex h-11 w-11 shrink-0 items-center justify-center rounded-full border border-line bg-white text-norfolk transition-colors hover:border-norfolk focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-fence aria-pressed:border-fiery aria-pressed:bg-blush aria-pressed:text-fiery"
                data-bookmark{% if recipe %}="{{ recipe.id }}"{% endif %}>
          <svg class="h-5 w-5 fill-none group-aria-pressed:fill-current" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.2-9.4C1.6 7.6 3.9 4 7.5 4c2 0 3.5 1.1 4.5 2.6C13 5.1 14.5 4 16.5 4c3.6 0 5.9 3.6 4.7 7.1-1.7 4.8-9.2 9.4-9.2 9.4z"/></svg>
        </button>
        {% endif %}
      </div>
    </div>
  </article>
</a>
