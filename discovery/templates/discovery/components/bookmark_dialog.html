{# Dialog pilih kategori bookmark; hanya bisa ditutup lewat Batal atau Simpan, daftar kategorinya diisi discovery.js #}
<dialog id="bookmark-dialog" aria-labelledby="bookmark-dialog-title" closedby="none"
        data-categories-url="{% url 'bookmarks:recipe_categories' 0 %}"
        data-save-url="{% url 'bookmarks:recipe_save' 0 %}"
        data-csrf="{{ csrf_token }}"
        class="m-auto w-[min(92vw,28rem)] rounded-3xl bg-background-white p-0 text-brand-green-dark shadow-md backdrop:bg-black/40">
  <form class="p-6" novalidate>
    <h2 id="bookmark-dialog-title" class="text-300">Simpan ke kategori</h2>
    <p class="mt-1 text-muted"><span data-field="recipe-name"></span></p>
    <fieldset class="mt-5">
      <legend class="mb-2 font-bold">Pilih kategori</legend>
      <p data-field="status" class="text-muted" hidden></p>
      <ul data-field="categories" class="flex flex-col gap-1 max-h-72 overflow-y-auto"></ul>
    </fieldset>
    <p data-field="error" class="mt-3 text-sm text-brand-red" hidden></p>
    <div class="mt-6 flex justify-end gap-3">
      <button type="button" data-cancel class="px-5 py-2.5 rounded-xl border-2 border-border-color transition-colors hover:bg-brand-beige cursor-pointer">Batal</button>
      <button type="submit" class="px-5 py-2.5 rounded-xl bg-brand-green text-background font-bold hover:opacity-90 cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed">Simpan</button>
    </div>
  </form>
  <template data-field="category-template">
    <li>
      <label class="flex items-center gap-3 px-3 py-2.5 rounded-xl cursor-pointer transition-colors hover:bg-brand-beige">
        <input type="checkbox" name="category" class="h-5 w-5 shrink-0 accent-brand-green cursor-pointer">
        <span data-field="category-name" class="truncate"></span>
      </label>
    </li>
  </template>
</dialog>
